# /etc/nginx/sites-available/ielts
#
# Replace example.com throughout, then:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ielts
#   sudo ln -sf /etc/nginx/sites-available/ielts /etc/nginx/sites-enabled/ielts
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot --nginx, which rewrites this file in place: it adds the TLS
# server block and turns this one into a redirect to it.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Speaking recordings and admin image uploads. The app caps images at 8 MB;
    # a Part 2 answer recorded at a decent bitrate is bigger.
    client_max_body_size 32m;

    # A listening test is a 40 MB download played over half an hour.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Add this only once HTTPS is confirmed working from a real browser. It is
    # deliberately hard to undo — browsers remember it for a year regardless of
    # what the server says afterwards.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Listening audio and speaking recordings.
    #
    # The app checks the session and the premium entitlement on every request,
    # then hands the file over with X-Accel-Redirect and returns nothing itself;
    # nginx does the reading and the range requests. `internal` is what makes
    # that safe — this path cannot be requested by a browser, only reached by a
    # redirect from upstream, so the guard cannot be walked around.
    #
    # The alias must match MEDIA_STORAGE_DIR, and the prefix must match
    # MEDIA_INTERNAL_PREFIX in .env.
    location /protected-media/ {
        internal;
        alias /var/lib/ielts/media/;
    }

    # Public test artwork and admin image uploads (maps, certificate scans).
    #
    # Served straight from disk by nginx, NOT proxied to Next. Next snapshots
    # the public/ directory at build time, so a file written here at runtime —
    # every admin upload — is a 404 through the app. nginx reads the directory
    # per request, so uploads appear immediately, and because deploy resets with
    # `git reset --hard` (never `git clean`), the untracked uploads survive it.
    location /test-media/ {
        alias /srv/ielts/public/test-media/;
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Empty rather than "upgrade": production Next has no websocket. Setting
        # it to keep-alive is what lets nginx reuse upstream connections.
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
